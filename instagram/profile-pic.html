<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 600px;
    height: 600px;
    overflow: hidden;
    background: #0b0c10;
  }
  .blobs { position: absolute; inset: 0; filter: blur(70px) saturate(140%); }
  .blob { position: absolute; border-radius: 50%; opacity: 0.6; }
  .b1 { width: 380px; height: 380px; background: #4f8cff; top: -60px; left: -60px; }
  .b2 { width: 360px; height: 360px; background: #b24fff; bottom: -60px; right: -60px; }
  .b3 { width: 300px; height: 300px; background: #ff4f9a; top: 180px; right: -40px; }

  .wrap {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg { width: 280px; height: 280px; }
</style>
</head>
<body>
  <div class="blobs">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>
  <div class="wrap">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#9fd8ff"/>
          <stop offset="50%" stop-color="#e0b3ff"/>
          <stop offset="100%" stop-color="#ffb3d9"/>
        </linearGradient>
      </defs>
      <polygon points="58,2 18,56 46,56 40,98 86,40 54,40" fill="url(#g)" stroke="white" stroke-width="2" stroke-linejoin="round"/>
    </svg>
  </div>
</body>
</html>
