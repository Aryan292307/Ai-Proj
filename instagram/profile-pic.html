<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 600px;
    height: 600px;
    overflow: hidden;
    background: #0b0c10;
  }
  .blobs { position: absolute; inset: 0; filter: blur(70px) saturate(140%); }
  .blob { position: absolute; border-radius: 50%; opacity: 0.6; }
  .b1 { width: 380px; height: 380px; background: #4f8cff; top: -60px; left: -60px; }
  .b2 { width: 360px; height: 360px; background: #b24fff; bottom: -60px; right: -60px; }
  .b3 { width: 300px; height: 300px; background: #ff4f9a; top: 180px; right: -40px; }

  .wrap {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .s {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 340px;
    font-weight: 800;
    line-height: 1;
    background: linear-gradient(135deg, #9fd8ff, #d6b3ff, #ffb3d9);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 30px rgba(178, 79, 255, 0.35));
  }
</style>
</head>
<body>
  <div class="blobs">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>
  <div class="wrap">
    <div class="s">S</div>
  </div>
</body>
</html>
