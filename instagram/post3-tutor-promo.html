<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background: #f4f7fb;
  }
  .blobs { position: absolute; inset: 0; filter: blur(100px) saturate(130%); }
  .blob { position: absolute; border-radius: 50%; opacity: 0.4; }
  .b1 { width: 560px; height: 560px; background: #2f6fed; top: -100px; left: -100px; }
  .b2 { width: 540px; height: 540px; background: #7a5cf0; top: 420px; right: -140px; }
  .b3 { width: 520px; height: 520px; background: #3fd0c9; bottom: -120px; left: 260px; }

  .content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 90px;
    color: #1c2b3a;
  }
  .brand { font-size: 32px; font-weight: 700; margin-bottom: 36px; color: #2f6fed; }
  h1 { font-size: 78px; font-weight: 800; line-height: 1.15; margin-bottom: 36px; }
  .highlight { color: #2f6fed; }
  p.desc { font-size: 34px; color: #5a6b7a; max-width: 760px; margin-bottom: 56px; }
  .cta {
    background: linear-gradient(90deg, #2f6fed, #7a5cf0);
    color: white;
    padding: 24px 60px;
    border-radius: 14px;
    font-size: 34px;
    font-weight: 700;
    box-shadow: 0 18px 44px rgba(47,111,237,0.3);
  }
  .footer { position: absolute; bottom: 55px; font-size: 24px; color: #8a93a3; }
</style>
</head>
<body>
  <div class="blobs">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>
  <div class="content">
    <div class="brand">CLARKE TUTORING</div>
    <h1>First session is <span class="highlight">free</span>.<br>No pressure, just<br>see if it clicks.</h1>
    <p class="desc">Math & Science, grades 6&ndash;12 &mdash; online or in-person.</p>
    <div class="cta">Book Free Trial</div>
  </div>
  <div class="footer">Sample design &middot; made by @pixelcraft.studio</div>
</body>
</html>
