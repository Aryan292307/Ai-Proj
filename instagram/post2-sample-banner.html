<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: Georgia, "Times New Roman", serif;
    background: #fdf6f3;
  }
  .blobs { position: absolute; inset: 0; filter: blur(100px) saturate(130%); }
  .blob { position: absolute; border-radius: 50%; opacity: 0.45; }
  .b1 { width: 560px; height: 560px; background: #c9767f; top: -100px; left: -100px; }
  .b2 { width: 540px; height: 540px; background: #e0a96b; top: 400px; right: -140px; }
  .b3 { width: 520px; height: 520px; background: #b98fd1; bottom: -120px; left: 260px; }

  .content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 90px;
    color: #3a2c2c;
  }
  .brand { font-size: 34px; font-weight: 700; letter-spacing: 1px; margin-bottom: 40px; }
  .offer {
    font-size: 150px;
    font-weight: 800;
    line-height: 1;
    color: #c9767f;
    margin-bottom: 10px;
  }
  .offer-sub { font-size: 50px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 50px; }
  p.desc { font-size: 34px; color: #7a6565; max-width: 760px; margin-bottom: 60px; }
  .cta {
    background: linear-gradient(90deg, #c9767f, #b98fd1);
    color: white;
    padding: 24px 60px;
    border-radius: 100px;
    font-size: 34px;
    font-weight: 700;
    box-shadow: 0 18px 44px rgba(201,118,127,0.3);
  }
  .footer {
    position: absolute;
    bottom: 55px;
    font-size: 24px;
    color: #9a8a8a;
  }
</style>
</head>
<body>
  <div class="blobs">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>
  <div class="content">
    <div class="brand">BLOOM &amp; BLADE SALON</div>
    <div class="offer">20%</div>
    <div class="offer-sub">off this weekend</div>
    <p class="desc">Haircuts, color &amp; styling &mdash; book your slot before Sunday.</p>
    <div class="cta">Book Now</div>
  </div>
  <div class="footer">Sample design &middot; made by @sparksite.co</div>
</body>
</html>
