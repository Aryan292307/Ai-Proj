<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background: #2b211b;
  }
  .blobs { position: absolute; inset: 0; filter: blur(100px) saturate(140%); }
  .blob { position: absolute; border-radius: 50%; opacity: 0.5; }
  .b1 { width: 560px; height: 560px; background: #e0943f; top: -100px; left: -100px; }
  .b2 { width: 540px; height: 540px; background: #e05c4f; top: 420px; right: -140px; }
  .b3 { width: 520px; height: 520px; background: #4fb8a3; bottom: -120px; left: 260px; }

  .content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 90px;
    color: #f3ece3;
  }
  .brand { font-size: 32px; font-weight: 700; margin-bottom: 36px; letter-spacing: 1px; }
  h1 { font-size: 88px; font-weight: 800; line-height: 1.1; margin-bottom: 36px; }
  .highlight { color: #e0943f; }
  p.desc { font-size: 34px; color: #cbb9a8; max-width: 760px; margin-bottom: 56px; }
  .cta {
    background: linear-gradient(90deg, #e0943f, #e05c4f);
    color: #2b211b;
    padding: 24px 60px;
    border-radius: 14px;
    font-size: 34px;
    font-weight: 700;
    box-shadow: 0 18px 44px rgba(224,148,63,0.35);
  }
  .footer { position: absolute; bottom: 55px; font-size: 24px; color: #a3917f; }
</style>
</head>
<body>
  <div class="blobs">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>
  <div class="content">
    <div class="brand">THE DAILY GRIND CAF&Eacute;</div>
    <h1>Good coffee.<br><span class="highlight">No rush.</span></h1>
    <p class="desc">Small-batch roasts &amp; fresh pastries, every morning.</p>
    <div class="cta">Find Us</div>
  </div>
  <div class="footer">Sample design &middot; made by @sparksite.co</div>
</body>
</html>
